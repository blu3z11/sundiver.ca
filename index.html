<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>I Know I Wont</title>
	<style>
		:root {
			color-scheme: light;
			--paper: #ffffff;
			--ink: #000000;
			--text-yellow: #ffc403;
			--background-blur: 6px;
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			width: 100%;
			height: 100%;
		}

		body {
			position: relative;
			isolation: isolate;
			min-height: 100vh;
			overflow: hidden;
			color: var(--ink);
			background-color: var(--paper);
			transition: color 0.3s ease, background-color 0.3s ease;
			margin: 0;
			padding: 0;
			display: flex;
			justify-content: center;
			align-items: center;
		}

		body.playing {
			color: var(--text-yellow);
			background-color: #1a1a1a;
		}

		body::before {
			position: fixed;
			inset: -100px;
			z-index: -1;
			background: url("superstar.jpg") center / cover no-repeat;
			content: "";
			filter: blur(var(--background-blur));
			opacity: 0;
			transition: opacity 0.3s ease;
		}

		body.playing::before {
			opacity: 1;
		}

		h1 {
			margin: 0;
			padding: 22px 24px;
			font-family: Arial, Helvetica, sans-serif;
			font-size: clamp(4rem, 13vw, 11rem);
			font-weight: 700;
			line-height: .85;
			letter-spacing: 0;
			text-align: center;
		}

		h1.comic-sans {
			font-family: "Comic Sans MS", cursive;
		}

		#music {
			position: fixed;
			width: 1px;
			height: 1px;
			border: 0;
			opacity: 0;
			pointer-events: none;
		}

		#playButton {
			position: fixed;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			background-color: #ffc403;
			color: white;
			border: none;
			border-radius: 12px;
			padding: 16px 32px;
			font-size: 18px;
			font-weight: 600;
			cursor: pointer;
			box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
			transition: background-color 0.3s ease;
			z-index: 2;
		}

		#playButton:hover {
			background-color: #ffea75;
		}

		#playButton:active {
			transform: translate(-50%, -50%) scale(0.98);
		}
	</style>
</head>
<body>
	<h1 id="title">NOW PLAYING - ...</h1>

	<button id="playButton">PLAY</button>

	<div id="music" aria-hidden="true"></div>
	<script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
	<script>
		const firstTrack = 'spotify:track:6mU7czKCBwd61T9H3cbsIZ';
		const nextTrack = 'spotify:track:088WAAsNCauHEEvgl5OUfk';
		let playbackState = 'first';
		let controller = null;

		function showStartPage() {
			document.getElementById('title').textContent = 'NOW PLAYING - ...';
			document.getElementById('title').classList.remove('comic-sans');
			document.getElementById('playButton').style.display = '';
			document.body.classList.remove('playing');
			playbackState = 'first';
		}

		// Initialize Spotify API
		window.onSpotifyIframeApiReady = function (IFrameAPI) {
			IFrameAPI.createController(document.getElementById('music'), {
				uri: firstTrack,
				width: '1',
				height: '1'
			}, function (ctrl) {
				controller = ctrl;
				ctrl.addListener('playback_update', function (event) {
					var playback = event.data;
					// Check if track is near the end
					if (playback.duration > 0 && playback.position >= playback.duration - 500) {
						if (playbackState === 'first') {
							// First track finished, load and play second track
							playbackState = 'second-loading';
							ctrl.loadUri(nextTrack);
							ctrl.play();
							playbackState = 'second';
						} else if (playbackState === 'second') {
							// Second track finished
							playbackState = 'finished';
							ctrl.pause();
							showStartPage();
						}
					}
				});
			});
		};

		// Handle play button click
		document.getElementById('playButton').addEventListener('click', function () {
			if (controller) {
				if (playbackState === 'finished' || playbackState === 'first') {
					playbackState = 'first';
					controller.loadUri(firstTrack);
				}
				controller.play();
			}
			document.getElementById('title').textContent = 'NOW PLAYING - I Know I Wont by sundiver ca';
			document.getElementById('title').classList.add('comic-sans');
			document.getElementById('playButton').style.display = 'none';
			document.body.classList.add('playing');
		});
	</script>
</body>
</html>
